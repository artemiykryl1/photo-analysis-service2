[project]
name = "photo-service"
version = "0.1.0"
description = "Photo analysis backend service - upload, storage and orchestration of photo analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "minio>=7.2",
    "python-json-logger>=2.0",
    "anyio>=4.3",
    "python-multipart>=0.0.9",
    "aiokafka>=0.14.0",
    "grpcio>=1.82.1",
    "protobuf>=7.35.1",
    "prometheus-client>=0.25.0",
    # TASK-003 D1 (tasks/TASK-003/20_design.md §2): image downscaling before
    # sending to the real analyzer (4 MiB gRPC message cap). Pinned minor -
    # different Pillow versions can encode slightly different output bytes
    # for the same input, which would make app/services/image_prep.py's
    # "same input -> same output" property test flaky across environments.
    "pillow>=11.0,<12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.0",
    "grpcio-tools>=1.82.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated protobuf/gRPC code (tasks/TASK-002/20_design.md §7.1) - never
# hand-edited beyond the one documented import fix, not linted like
# hand-written code.
extend-exclude = ["app/grpc_gen/analyzer_pb2.py", "app/grpc_gen/analyzer_pb2_grpc.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker daemon (testcontainers); skipped automatically when Docker is unreachable",
]
