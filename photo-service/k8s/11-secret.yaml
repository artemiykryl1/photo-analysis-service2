# TASK-003 C3 (tasks/TASK-003/20_design.md §9.4): credential-bearing values,
# shared via `envFrom: secretRef` by api/worker/postgres/minio/grafana/
# migrate-job. `stringData` is used (not `data`) purely for readability -
# Kubernetes base64-encodes it into `data` server-side on apply, the effect
# is identical.
#
# DEV-ONLY PLACEHOLDERS. These are the well-known local-dev defaults already
# used by `docker-compose.yml` (`photo`/`photo`, `minioadmin`/`minioadmin`,
# `admin_dev_only`) - acceptable ONLY because this is a fully local,
# ephemeral kind cluster with no external exposure (constitution.md §3.3
# forbids hardcoded secrets in anything beyond this kind of throwaway local
# demo). Outside local demo use, this file must NOT be committed as-is:
# create the Secret out-of-band instead, e.g.
#   kubectl -n photo-service create secret generic photo-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=POSTGRES_PASSWORD=... ...
# or via an external secret manager - never via a file checked into git.
apiVersion: v1
kind: Secret
metadata:
  name: photo-secrets
  namespace: photo-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://photo:photo@postgres:5432/photo_db"
  POSTGRES_USER: "photo"
  POSTGRES_PASSWORD: "photo"
  POSTGRES_DB: "photo_db"

  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"

  GF_SECURITY_ADMIN_PASSWORD: "admin_dev_only"
