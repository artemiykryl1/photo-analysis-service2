# TASK-002 (tasks/TASK-002/20_design.md §9.1): scrapes the API's RED +
# domain metrics (port 8000, /metrics) and the worker's analysis-pipeline
# metrics (port 8001, /metrics). Mounted read-only into the `prometheus`
# service in docker-compose.yml.
#
# TASK-003 C4 (design §11.3): `rule_files` loads the alerting rules shared
# with the Kubernetes ConfigMap (`k8s/40-prometheus.yaml`) - same content,
# mounted at the same path in both environments.
global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: photo-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: photo-worker
    static_configs:
      - targets: ["worker:8001"]
