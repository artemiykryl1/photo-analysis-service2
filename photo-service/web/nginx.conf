# TASK-003 B2 (design §8.2): listen on 0.0.0.0:80 inside the container -
# port publication/mapping is entirely the caller's job (docker-compose
# `ports:`, Kubernetes Service), not this file's.
server {
    listen 0.0.0.0:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # `config.js` is generated by docker-entrypoint.sh at CONTAINER START
    # (not at build time) - it must never be cached by the browser, or a
    # redeployed container with a different API_BASE_URL would appear to
    # keep talking to the old address until a hard refresh.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
