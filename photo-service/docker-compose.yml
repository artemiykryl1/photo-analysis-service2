services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: photo
      POSTGRES_DB: photo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TASK-002 (tasks/TASK-002/20_design.md §10.3): single-broker KRaft Kafka
  # (no ZooKeeper) - simplification for MVP per feature-upload/tasks.md
  # "Зафиксированные решения".
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10

  # TASK-002 (design §6): deterministic gRPC analyzer stub - swapped for a
  # real analyzer in TASK-003 by pointing ANALYZER_GRPC_ADDR elsewhere.
  analyzer-stub:
    build:
      context: .
      dockerfile: analyzer-stub/Dockerfile
    restart: unless-stopped
    ports:
      - "50051:50051"

  api:
    build: .
    restart: unless-stopped
    # .env is optional (gitignored, local overrides only) - Settings already
    # ship with docker-compose-friendly defaults matching the values below.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://photo:photo@postgres:5432/photo_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: photos
      MINIO_SECURE: "false"
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_ANALYSIS_REQUESTED: photo.analysis.requested
      KAFKA_CONSUMER_GROUP: photo-analysis-workers
      ANALYZER_GRPC_ADDR: analyzer-stub:50051
      # TASK-003 B7 (design §8.5): the web UI is served from a different
      # origin (localhost:8080) than the API (localhost:8000) - an explicit
      # CORS allow-list is required for the browser to accept the response.
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Review-1 fix (tasks/TASK-002/40_review-1.md B1): upload itself still
      # does not depend on Kafka being reachable at runtime (outbox pattern,
      # design §4) - this dependency only delays container start until
      # Kafka's KRaft bootstrap (~10-20s) has actually finished, so the
      # producer's first `start()` attempt in `app.main.lifespan` is not
      # racing it. The outbox publisher's `ensure_started()` retry (see
      # `app/services/outbox.py`) is the real self-healing safety net if
      # Kafka is unhealthy/unreachable for longer than that.
      kafka:
        condition: service_healthy
    # Review fix (tasks/TASK-002/40_review-1.md M7): `exec` before the
    # final command replaces the `sh` wrapper (PID 1 in the container)
    # with uvicorn, so SIGTERM from `docker compose stop` reaches uvicorn
    # directly instead of being swallowed by `sh -c` - required for
    # uvicorn's own graceful shutdown (drain in-flight requests) instead
    # of a SIGKILL once the stop timeout elapses.
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # TASK-002 (design §5, §10.3): same image as `api`, different command -
  # consumes photo.analysis.requested and calls analyzer-stub over gRPC.
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://photo:photo@postgres:5432/photo_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: photos
      MINIO_SECURE: "false"
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_ANALYSIS_REQUESTED: photo.analysis.requested
      KAFKA_CONSUMER_GROUP: photo-analysis-workers
      ANALYZER_GRPC_ADDR: analyzer-stub:50051
      WORKER_METRICS_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      analyzer-stub:
        condition: service_started
      # Not strictly required (the worker only needs the schema to exist by
      # the time it processes its first message), but avoids racing `api`'s
      # `alembic upgrade head` on a fresh database.
      api:
        condition: service_started
    # Review fix (tasks/TASK-002/40_review-1.md M7): `exec` replaces the
    # `sh` wrapper (PID 1 in the container) with the python process, so
    # SIGTERM from `docker compose stop` reaches app/worker/main.py's
    # signal handlers directly - without it, `sh -c` stays PID 1, does
    # not forward SIGTERM to its child, and the worker gets SIGKILLed
    # after the stop timeout instead of finishing its in-flight message
    # and committing the offset (graceful shutdown, design §5.6).
    command: sh -c "exec uv run python -m app.worker.main"

  # TASK-002 (design §9.1): scrapes api:8000/metrics + worker:8001/metrics.
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TASK-003 C4 (design §11.3): alerting rules, shared verbatim with
      # the Kubernetes ConfigMap in k8s/40-prometheus.yaml.
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"

  # TASK-002 (design §9.2): provisioned datasource + dashboard, no manual
  # click-through needed - see grafana/provisioning/**, grafana/dashboards/**.
  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      # Review-2 fix (tasks/TASK-002/41_review-2.md #1): no hardcoded
      # credential - overridable via .env, with an explicit dev-only
      # default so it is obvious this must be changed for anything beyond
      # local development (see .env.example).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  # TASK-003 B7 (design §8.1-8.2): static nginx image, the SAME one used in
  # Kubernetes - only the env vars below differ between environments.
  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8000
      SHARPNESS_THRESHOLD: "100.0"
      POLL_INTERVAL_MS: "3000"
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  kafkadata:
